<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizoraX - Tutorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Chakra+Petch:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060810;
            --card-bg: rgba(14, 18, 30, 0.92);
            --gold-accent: #ffb703;
            --cyber-cyan: #00f0ff;
            --plasma-magenta: #ff0077;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(255, 183, 3, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 70%),
                linear-gradient(180deg, rgba(6, 8, 16, 0.8) 0%, rgba(6, 8, 16, 0.95) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.02) 2px, rgba(0, 240, 255, 0.02) 4px);
        }

        /* Líneas de escáner superior e inferior */
        .cyber-line-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), var(--cyber-cyan), transparent);
            box-shadow: 0 0 15px var(--cyber-cyan);
            z-index: 10;
        }

        .cyber-line-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--plasma-magenta), var(--gold-accent), transparent);
            box-shadow: 0 0 15px var(--plasma-magenta);
            z-index: 10;
        }

        /* Contenedor Principal HUD */
        .hud-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                        0 0 25px rgba(0, 240, 255, 0.08);
            clip-path: polygon(
                0 20px, 
                20px 0, 
                calc(100% - 20px) 0, 
                100% 20px, 
                100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 
                20px 100%, 
                0 calc(100% - 20px)
            );
        }

        .hud-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: var(--gold-accent);
            box-shadow: 0 0 10px var(--gold-accent);
        }

        /* TÍTULO TUTORIAL */
        .hud-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(3rem, 7vw, 4.5rem);
            line-height: 1;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: var(--text-primary);
            background: linear-gradient(180deg, #ffffff 30%, var(--cyber-cyan) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.4));
        }

        /* CONTENEDOR GENERAL INTERNO */
        .tutorial-container {
            background: rgba(6, 8, 16, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* TEXTO */
        .tutorial-text {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 600px;
        }

        /* BLOQUE CENTRAL DE IMAGEN Y BOTONES LATERALES */
        .media-slider-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        /* BOTONES CON IMAGEN (Izquierda y Derecha) */
        .nav-btn {
            background: rgba(0, 240, 255, 0.05);
            border: 1.5px solid var(--cyber-cyan);
            border-radius: 8px;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            flex-shrink: 0;
            padding: 8px;
        }

        .nav-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: scale(1.08);
        }

        .nav-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* MARCO DE LA IMAGEN PRINCIPAL */
        .image-container {
            flex-grow: 1;
            max-width: 550px;
            aspect-ratio: 16 / 9;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #anterior{
            display: none;
        }
        /* ADAPTABILIDAD MOBILE Y TABLET */
        @media (max-width: 600px) {
            .hud-card {
                padding: 30px 15px;
            }

            .tutorial-container {
                padding: 15px;
            }

            .media-slider-wrapper {
                gap: 8px;
            }

            .nav-btn {
                width: 40px;
                height: 40px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="cyber-line-top"></div>
    <div class="cyber-line-bottom"></div>

    <main class="hud-card">
        <!-- TÍTULO -->
        <h1 class="hud-title">TUTORIAL</h1>

        <!-- CONTENEDOR GENERAL -->
        <div class="tutorial-container">
            
            <!-- TEXTO -->
            <p class="tutorial-text">
                TEXTO
            </p>

            <div class="media-slider-wrapper">
                <button class="nav-btn" id="anterior"aria-label="Anterior" disabled>
                    <img src="./IMG/Captura de pantalla 2026-08-17 163454-Photoroom.png" alt="Icono Anterior">
                </button>
                <div class="image-container" id="central">
                    <img src="" alt="Imagen Tutorial">
                </div>
                <button class="nav-btn" id="siguiente" aria-label="Siguiente">
                    <img src="./IMG/Captura de pantalla 2026-08-17 163448-Photoroom.png" alt="Icono Siguiente">
                </button>

            </div>

        </div>
    </main>

</body>
<script>
    const texto = document.querySelector(".tutorial-text")
    const siguiente = document.getElementById("siguiente")
    const anterior = document.getElementById("anterior")
    const central = document.getElementById("central")
    const listaimagenes = ["./IMG/PAG1.png","./IMG/PAG2.png","./IMG/PAG3.png"]
    const listatextos = ["EXISTEN CATEGORIAS DIFERENTES, COMO SE VE EN PANTALLA CADA CATEGORIA POSEE 20 PREGUNTAS", "CADA PREGUNTA TIENE UN CONTADOR DE 15 SEGUNDOS, Y TIENE 5 ALTERNATIVAS","SI RESPONDE CORRECTAMENTE SUMA 5 PUNTOS Y SI RESPONDE INCORRECTAMENTE RESTA 5 PUNTOS, SI NO RESPONDE NO SUMA NI RESTA, AL FINAL DEL CUESTIONARIO SE VERA LOS PUNTOS ACUMULADOS"]
    central.querySelector("img").src = "./IMG/PAG1.png"
    texto.textContent = "EXISTEN CATEGORIAS DIFERENTES, COMO SE VE EN PANTALLA CADA CATEGORIA POSEE 20 PREGUNTAS"
    let conteo = 0
    siguiente.onclick = ()=>{
        conteo++
        central.querySelector("img").src = listaimagenes[conteo]
        texto.textContent = listatextos[conteo]
        if (conteo > 0){
            anterior.style.display = "block"
            anterior.disabled = false
        }
        if (conteo === listaimagenes.length - 1){
            siguiente.style.display = "none"
            siguiente.disabled = true
        }
    }

    anterior.onclick = ()=>{
        conteo--
        central.querySelector("img").src = listaimagenes[conteo]
        texto.textContent = listatextos[conteo]
        if (conteo === 0){
            anterior.style.display = "none"
            anterior.disabled = true
        }
        if (conteo < listaimagenes.length - 1){
            siguiente.style.display = "block"
            siguiente.disabled = false
        }
    }
</script>
</html>
