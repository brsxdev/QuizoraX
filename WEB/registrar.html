<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizoraX - Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Chakra+Petch:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060810;
            --card-bg: rgba(14, 18, 30, 0.92);
            --gold-accent: #ffb703;
            --cyber-cyan: #00f0ff;
            --plasma-magenta: #ff0077;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --input-bg: rgba(6, 8, 16, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(255, 183, 3, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 70%),
                linear-gradient(180deg, rgba(6, 8, 16, 0.8) 0%, rgba(6, 8, 16, 0.95) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.02) 2px, rgba(0, 240, 255, 0.02) 4px);
        }

        /* Líneas de escáner superior e inferior */
        .cyber-line-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), var(--cyber-cyan), transparent);
            box-shadow: 0 0 15px var(--cyber-cyan);
            z-index: 10;
        }

        .cyber-line-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--plasma-magenta), var(--gold-accent), transparent);
            box-shadow: 0 0 15px var(--plasma-magenta);
            z-index: 10;
        }

        /* Tarjeta Estilo Marco HUD */
        .hud-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                        0 0 25px rgba(0, 240, 255, 0.08);
            clip-path: polygon(
                0 20px, 
                20px 0, 
                calc(100% - 20px) 0, 
                100% 20px, 
                100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 
                20px 100%, 
                0 calc(100% - 20px)
            );
        }

        .hud-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: var(--cyber-cyan);
            box-shadow: 0 0 10px var(--cyber-cyan);
        }

        .hud-badge {
            display: inline-block;
            font-family: 'Teko', sans-serif;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--cyber-cyan);
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--cyber-cyan);
            padding: 2px 14px;
            margin-bottom: 12px;
            border-radius: 2px;
        }

        /* TÍTULO */
        .hud-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 28px;
            
            color: var(--text-primary);
            background: linear-gradient(180deg, #ffffff 30%, var(--cyber-cyan) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.3));
        }

        /* FORMULARIO E INPUTS */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .cyber-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--text-primary);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .cyber-input::placeholder {
            color: rgba(160, 174, 192, 0.5);
        }

        .cyber-input:focus {
            border-color: var(--cyber-cyan);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }

        /* BOTÓN DE ACCIÓN */
        .cyber-btn {
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
            border: none;
            width: 100%;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--gold-accent) 0%, #d48800 100%);
            color: #ffffff;
            font-weight: 700;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.3);
        }

        .cyber-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #ffc83b 0%, var(--gold-accent) 100%);
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.6);
        }

        /* Adaptabilidad Mobile y Tablet */
        @media (max-width: 600px) {
            .hud-card {
                padding: 35px 20px 30px;
            }
            .hud-title {
                font-size: 1.8rem;
            }
            .cyber-btn {
                font-size: 1.3rem;
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="cyber-line-top"></div>
    <div class="cyber-line-bottom"></div>

    <main class="hud-card">
        <div class="hud-badge">Registro de Usuario</div>

        <h1 class="hud-title">Registrarse con una nueva cuenta</h1>

        <form class="register-form">
            <div class="input-group">
                <label for="reg-username">Usuario</label>
                <input type="text" id="reg-username" class="cyber-input" placeholder="Ej: PlayerOne(El usuario es permanente)" required>
            </div>

            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" class="cyber-input" placeholder="Ej: 12345" required>
            </div>

            <button type="button" class="cyber-btn" id="bton">Registrarse</button>
        </form>
    </main>

</body>
<script>
    const usertxt = document.getElementById("reg-username")
    const pwdtxt = document.getElementById("reg-password")
    const bton = document.getElementById("bton")

    bton.addEventListener("click",()=>{
        if (usertxt.value.trim() !== "" && pwdtxt.value.trim() !== ""){
            fetch("/registrarse",{
                method:"POST",
                headers:{"Content-Type": "application/json"},
                body:JSON.stringify({usuario:usertxt.value, pwd:pwdtxt.value})
            })
            .then(res=>res.json())
            .then(rpta=>{
                if (rpta.existe === true){
                    pwdtxt.value = ""
                    usertxt.style.color = "Red"
                    usertxt.value = "Usuario ya existente"
                    setTimeout(()=>{
                        usertxt.style.color = "White"
                        usertxt.value=""
                    },2100)
                } else if (rpta.existe === false){
                    window.location.replace("/principal")
                }
            })
        }
    })
</script>
</html>
