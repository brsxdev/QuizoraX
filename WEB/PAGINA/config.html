<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizoraX - Ajustes de Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Chakra+Petch:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #060810;
            --card-bg: rgba(14, 18, 30, 0.92);
            --gold-accent: #ffb703;
            --cyber-cyan: #00f0ff;
            --plasma-magenta: #ff0077;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --input-bg: rgba(6, 8, 16, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(255, 183, 3, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 70%),
                linear-gradient(180deg, rgba(6, 8, 16, 0.8) 0%, rgba(6, 8, 16, 0.95) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.02) 2px, rgba(0, 240, 255, 0.02) 4px);
        }

        /* Líneas de escáner superior e inferior */
        .cyber-line-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), var(--cyber-cyan), transparent);
            box-shadow: 0 0 15px var(--cyber-cyan);
            z-index: 10;
        }

        .cyber-line-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--plasma-magenta), var(--gold-accent), transparent);
            box-shadow: 0 0 15px var(--plasma-magenta);
            z-index: 10;
        }

        /* Tarjeta Estilo Marco HUD de Esports */
        .hud-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 45px 35px 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                        0 0 25px rgba(0, 240, 255, 0.08);
            clip-path: polygon(
                0 20px, 
                20px 0, 
                calc(100% - 20px) 0, 
                100% 20px, 
                100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 
                20px 100%, 
                0 calc(100% - 20px)
            );
        }

        .hud-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: var(--gold-accent);
            box-shadow: 0 0 10px var(--gold-accent);
        }

        .hud-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .hud-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            line-height: 0.9;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-primary);
            background: linear-gradient(180deg, #ffffff 30%, var(--cyber-cyan) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.4));
        }

        /* FILAS Y CONTENEDOR */
        .cyber-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
        }

        .form-group {
            display: grid;
            grid-template-columns: minmax(180px, auto) 1fr;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .form-group.align-top {
            align-items: flex-start;
        }

        .form-label {
            font-family: 'Teko', sans-serif;
            font-size: 1.35rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-primary);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            white-space: normal;
            line-height: 1.1;
        }

        /* INPUTS Y TEXTAREA */
        .cyber-input, 
        .cyber-textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--text-primary);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1rem;
            padding: 12px 16px;
            outline: none;
            transition: all 0.25s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .cyber-textarea {
            resize: vertical;
            min-height: 110px;
        }

        .cyber-input:focus, 
        .cyber-textarea:focus {
            border-color: var(--cyber-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
            background: rgba(14, 18, 30, 0.95);
        }

        /* BOTÓN DE GUARDAR */
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            width: 100%;
        }

        .cyber-btn {
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 12px 45px;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
            border: none;
            background: linear-gradient(135deg, var(--gold-accent) 0%, #d48800 100%);
            color: #060810;
            font-weight: 700;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.3);
            min-width: 220px;
        }

        .cyber-btn:hover {
            transform: scale(1.03);
            background: linear-gradient(135deg, #ffc83b 0%, var(--gold-accent) 100%);
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.6);
        }

        /* RESPONSIVE DESIGN (Tablets y Celulares) */
        @media (max-width: 640px) {
            .hud-card {
                padding: 35px 20px 30px;
            }

            .form-group, 
            .form-group.align-top {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .form-label {
                font-size: 1.2rem;
            }

            .cyber-btn {
                width: 100%;
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

    <div class="cyber-line-top"></div>
    <div class="cyber-line-bottom"></div>

    <main class="hud-card">
        <header class="hud-header">
            <h1 class="hud-title">Ajustes</h1>
        </header>

        <div class="cyber-form">
            <div class="form-group align-top">
                <label for="descripcion" class="form-label">Descripción:</label>
                <textarea id="descripcion" class="cyber-textarea" placeholder="Escribe tu nueva descripción aquí..."></textarea>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Cambiar contraseña:</label>
                <input id="password" class="cyber-input" placeholder="Nueva contraseña">
            </div>
            <div class="btn-container">
                <button class="cyber-btn" id="bton">Guardar</button>
            </div>
        </div>
    </main>

</body>
</html>
<script>
    const descripcioninpt = document.getElementById("descripcion")
    const passwordinpt = document.getElementById("password")
    const bton = document.getElementById("bton")

    bton.addEventListener("click",()=>{
        fetch("/actualusuario")
        .then(res=>res.json())
        .then(rpta=>{
            let objeto = {id:rpta.usuarioid}
            if (descripcioninpt.value.trim() !== ""){
                objeto.descripcion = descripcioninpt.value
            }
            if (passwordinpt.value.trim() !== ""){
                objeto.pwd = passwordinpt.value
            }
            fetch("/mandarconfig",{method:"POST",headers:{"Content-Type": "application/json"},body:JSON.stringify(objeto)})
            .then(res=>res.json())
            .then(rpta2=>{
                if (rpta2.respuesta){
                    window.location.replace("/principal")
                }
            })
        })
    })
</script>
</html>
